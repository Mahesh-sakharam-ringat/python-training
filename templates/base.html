<!DOCTYPE html>
<html>
<head>
    <title>Coaching class manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">🎓 Coaching class manager</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/">Home</a>
            <a class="nav-link text-white" href="/record">Record</a>
            <a class="nav-link text-white" href="/add">Add Student</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-success">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}
</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 Coaching class manager
</footer>

</body>
</html>
