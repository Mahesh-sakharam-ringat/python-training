<!DOCTYPE html>
<html>
<head>
<title>Coaching Class Manager</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-primary"></body>
<nav class="navbar navbar-dark bg-primary navbar-expand-lg">
<div class="container">
    <div class="container-fluid">
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/students">Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/teachers">Teachers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/subjects">Subjects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/search">Search</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/filter">Filter</a>
                </li>
            </ul>

            {% if session.username %}
                <span class="text-white me-2">👤 {{ session.username }}</span>
                <a class="text-white" href="{{ url_for('logout') }}">🔓 Logout</a>
            {% else %}
                <a class="text-white" href="{{ url_for('login') }}">🔒 Login</a>
            {% endif %}
        </div>
    {% block content %}
    {% endblock %}
</div>
 
</li>
</div>
</nav>

</body>
</html>
