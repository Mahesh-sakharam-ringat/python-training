{% extends 'base.html' %}

{% block content %}

<h1>Add New Student</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Student Name</label>
        <input type="text" class="form-control" name="name" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Marks</label>
        <input type="number"
               class="form-control"
               name="marks"
               min="0"
               max="4"
               required>
    </div>

    <button class="btn btn-success">
        Add Student
    </button>

</form>

{% endblock %}
