<!DOCTYPE html>
<html>
<head>
    <title>Search - Coaching Class Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .container {
            width: 500px;
            margin: auto;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Search Students and Teachers</h2>

        <a href = "{{url_for('students')}}" class = "btn btn-secondary btn-sm">
        ← All Students
        </a>

        <a href = "{{url_for('teachers')}}" class = "btn btn-secondary btn-sm">
        ← All Teachers
        </a>
    <form method="POST" action="/search">
        <label>Select Category:</label>
        <select name="category">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>

        <label>Search By:</label>
        <select name="search_by">
            <option value="id">ID</option>
            <option value="name">Name</option>
            <option value="contact">Contact Number</option>
        </select>

        <label>Enter Value:</label>
        <input type="text" name="search_value" placeholder="Enter ID, Name or Contact">

        <button type="submit">Search</button>
    </form>
</div>

</body>
</html>
