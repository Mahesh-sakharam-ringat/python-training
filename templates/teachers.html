{% extends 'base.html' %}

{% block content %}

<h2>Add Teacher</h2>

<a href="/add_teacher"
class="btn btn-primary mb-3">
Add Teacher
</a>

<table class="table table-bordered">

<tr>
<th>ID</th>
<th>Name</th>
<th>Subject</th>
<th>Contact</th>
<th>Action</th>
</tr>

{% for s in teachers %}
<tr>

<td>{{ s.teacher_id }}</td>
<td>{{ s.teacher_name }}</td>
<td>{{ s.subject }}</td>
<td>{{ s.contact }}</td>

<td>
<a href="/delete_teacher/{{s.id}}"
class="btn btn-danger btn-sm">
Delete
</a>
</td>

</tr>
{% endfor %}

</table>

{% endblock %}
